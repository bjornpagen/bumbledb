[workspace]
resolver = "2"
members = [
    "crates/bumbledb",
    "crates/bumbledb-bench",
    "crates/bumbledb-macros",
    "crates/bumbledb-query",
    "crates/bumbledb-query-macros",
    "crates/bumbledb-theory",
]
# The napi bridge crate at ts/crate is NOT a member: the engine workspace stays
# heed+blake3-pure (no napi). ts/crate carries its own empty [workspace] table;
# this exclude is the explicit belt-and-suspenders pin against auto-discovery.
# The C ABI crate at crates/bumbledb-c follows the same law: a standalone
# staticlib/cdylib leaf with its own empty [workspace] table, excluded here.
exclude = [
    "ts/crate",
    "crates/bumbledb-c",
]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# nightly-2026-08-15: `assert!(xs.is_empty())` is the readable empty check;
# clippy's rewrite (`assert_eq!(xs, [] as [T; 0])`) is worse.
assert_is_empty = "allow"

# Portable release: fat LTO + one codegen unit. No target-cpu=native
# (published darwin-arm64 must run on any Apple Silicon). panic=unwind
# stays: catch_unwind is load-bearing in the engine, bench, and C ABI.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
