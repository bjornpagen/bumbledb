[workspace]
resolver = "2"
members = [
    "crates/bumbledb",
    "crates/bumbledb-bench",
    "crates/bumbledb-log",
    "crates/bumbledb-macros",
    "crates/bumbledb-query",
    "crates/bumbledb-query-macros",
    "crates/bumbledb-theory",
]

exclude = [
    "ts/crate",
]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

assert_is_empty = "allow"

# (published darwin-arm64 must run on any Apple Silicon). panic=unwind
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Native sampling needs inline frames and source locations, not debug-mode
# execution. Keep the release optimizer and unwind information unchanged.
[profile.profiling]
inherits = "release"
debug = true
split-debuginfo = "packed"
strip = "none"
