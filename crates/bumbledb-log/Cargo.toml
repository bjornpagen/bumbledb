[package]
name = "bumbledb-log"
version = "0.17.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bumbledb = { path = "../bumbledb" }
blake3 = "1.8.5"

[dev-dependencies]
bumbledb = { path = "../bumbledb", features = ["trace"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
