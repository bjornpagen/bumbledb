[package]
name = "bumbledb-log"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["store"]
# The S3 backend and its runtime. Off, the grammar core — codec, braids,
# vector, sidecar/manifest documents, keys/scratch, fs/mem stores —
# compiles dependency-lean.
store = ["dep:object_store", "dep:tokio"]

[dependencies]
bumbledb = { path = "../bumbledb" }
blake3 = "1.8.5"
futures = "0.3"
object_store = { version = "0.14.1", features = ["aws"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time"], optional = true }

[[bin]]
name = "duty"
required-features = ["store"]

[dev-dependencies]
bumbledb-bench = { path = "../bumbledb-bench" }
bumbledb = { path = "../bumbledb", features = ["trace"] }
serde_json = "1"

[lints]
workspace = true
