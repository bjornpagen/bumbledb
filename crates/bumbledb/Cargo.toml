[package]
name = "bumbledb"
version.workspace = true
edition = "2024"
publish = false

[features]
# Test support for dependent crates' test suites. Never enabled by a product build.
testing = []
# Empty; deleted once bumbledb-bench's manifest stops naming them.
alloc-counter = []
ground-off = []

[dependencies]
blake3 = "1.8.7"
fearless_simd = "1.1"
bumbledb-macros = { path = "../bumbledb-macros" }
bumbledb-query-macros = { path = "../bumbledb-query-macros" }

bumbledb-theory = { path = "../bumbledb-theory" }
heed = { version = "0.22", default-features = false } 

# On Apple platforms LMDB's default lock implementation is SysV semaphores,
[target.'cfg(target_os = "macos")'.dependencies]
heed = { version = "0.22", default-features = false, features = ["posix-sem"] }

[dev-dependencies]
fearless_simd = { version = "1.1", features = ["force_support_fallback"] }
heed = { version = "0.22", default-features = false }

[lints]
workspace = true
