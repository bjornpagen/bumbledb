[package]
name = "bumbledb-node"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bumbledb = { path = "../bumbledb" }
napi = { version = "3.14", default-features = true, features = ["napi8"] }
napi-derive = "3.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1"

[lints]
workspace = true
