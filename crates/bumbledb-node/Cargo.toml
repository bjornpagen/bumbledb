[package]
name = "bumbledb-node"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
alloc-counter = ["bumbledb/alloc-counter"]

[dependencies]
bumbledb = { path = "../bumbledb" }
napi = { version = "3.14", default-features = true, features = ["napi8"] }
napi-derive = "3.6"
serde_json = "1"

[lints]
workspace = true
