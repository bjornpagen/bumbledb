[package]
name = "bumbledb-bench"
version.workspace = true
edition = "2024"
publish = false

[features]
obs = ["bumbledb/trace", "bumbledb/alloc-counter"]

[dependencies]
bumbledb = { path = "../bumbledb" }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }

[dev-dependencies]
bumbledb = { path = "../bumbledb", features = ["ground-off"] }

[lints]
workspace = true
