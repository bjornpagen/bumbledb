[package]
name = "bumbledb-c"
version = "0.17.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "bumbledb_c"

crate-type = ["staticlib", "cdylib"]

# SAFETY comment on the block. `unsafe_op_in_unsafe_fn` keeps the extern
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

assert_is_empty = "allow"

missing_errors_doc = "allow"

missing_safety_doc = "allow"

[dependencies]

bumbledb = { path = "../bumbledb" }
