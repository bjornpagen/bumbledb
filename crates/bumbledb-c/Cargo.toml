# The C-ABI crate: bdb_* symbols, dumb marshal only.
# Built as a plain cargo staticlib/cdylib; the generated header lives at
# include/bumbledb_c.h (regenerated by the pinned cbindgen — see
# cbindgen.toml). The dumb-bridge law of ts/crate holds here verbatim: no
# logic beyond marshaling ever lives in this crate — anything smart belongs
# in the host or in the bumbledb engine itself.
[package]
name = "bumbledb-c"
version = "0.16.0"
edition = "2024"
publish = false

# This crate is a standalone leaf, never a member of any enclosing cargo
# workspace (the ts/crate precedent): the root Cargo.toml [workspace]
# excludes crates/bumbledb-c to keep the engine workspace heed+blake3-pure;
# the empty workspace table below is the belt-and-suspenders pin that also
# stops any future enclosing workspace from auto-adopting it.
[workspace]

[lib]
name = "bumbledb_c"
# The static library is the preferred native application path; the shared
# library exists for downstream packaging and testing.
crate-type = ["staticlib", "cdylib"]

# The FFI lint regime (the ts/crate precedent): the bridge joins the
# engine's unsafe wall. `unsafe_code = "deny"` is the same workspace law the
# engine crates inherit — every unsafe site here is a sanctioned carve-out,
# `#[expect(unsafe_code, reason = "…")]` with a real per-site reason and a
# SAFETY comment on the block. `unsafe_op_in_unsafe_fn` keeps the extern
# entries honest: an `unsafe fn` body gets no ambient license — each unsafe
# operation names its own block. The clippy set is the engine's
# (workspace.lints.clippy at the repo root), spelled here because a
# workspace-excluded leaf inherits nothing.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# nightly-2026-08-15: same workspace allow; this leaf inherits nothing.
assert_is_empty = "allow"
# The one crate-level carve-out (the ts/crate precedent): every export
# reports failure through the `bdb_status` + `bdb_error` out-param protocol
# and the error taxonomy has ONE owner — the lib.rs module doc — restated
# where a surface deviates, never per function.
missing_errors_doc = "allow"
# ABI functions take raw handles and views by design; the safety contract
# is the generated header's, documented once per type, not per function.
missing_safety_doc = "allow"

[dependencies]
# Path dependency on the in-repo engine crate: crates/bumbledb-c/../bumbledb.
# ORDERING LAW (the ts/crate precedent): version discipline here is
# sequencing, not a version pin — the engine is consumed at whatever the
# working tree holds, and any engine change lands BEFORE the ABI/bridge
# change that consumes it.
bumbledb = { path = "../bumbledb" }
