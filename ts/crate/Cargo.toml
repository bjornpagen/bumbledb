[package]
name = "bumbledb-node"

version = "0.20.1"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

# SAFETY comment on the block. `unsafe_op_in_unsafe_fn` keeps the napi trait
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

assert_is_empty = "allow"

missing_errors_doc = "allow"

[dependencies]

bumbledb = { path = "../../crates/bumbledb" }
# The grammar core only: the store feature (object_store + tokio) stays
# out of the cdylib; IO lives in the TypeScript driver.
bumbledb-log = { path = "../../crates/bumbledb-log", default-features = false }
napi = { version = "3", default-features = true, features = ["napi8"] }
napi-derive = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[dev-dependencies]

serde_json = "1"
