# A standalone consumer of the `bumbledb` crate, outside the workspace so it
# resolves `bumbledb` as a path dependency the way an application would.
#   cargo run --manifest-path examples/consumers/rust/Cargo.toml
[package]
name = "bumbledb-consumer-fixture"
edition = "2024"
publish = false

[workspace]

[dependencies]
bumbledb = { path = "../../../crates/bumbledb" }
