# Real AWS: the log on an S3 Express directory bucket, checkpoints on an S3
# Standard bucket, credentials from GitHub OIDC. Configured by the repository
# variables below; a missing one fails the job.
name: s3-aws

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  s3-aws:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUMBLEDB_AWS_ROLE_ARN: ${{ vars.BUMBLEDB_AWS_ROLE_ARN }}
      BUMBLEDB_S3_REGION: ${{ vars.BUMBLEDB_S3_REGION }}
      BUMBLEDB_S3_LOG_BUCKET: ${{ vars.BUMBLEDB_S3_LOG_BUCKET }}
      BUMBLEDB_S3_CKPT_BUCKET: ${{ vars.BUMBLEDB_S3_CKPT_BUCKET }}
      BUMBLEDB_S3_TARGET: aws
      BUMBLEDB_S3_PREFIX: ci/${{ github.run_id }}-${{ github.run_attempt }}/
    steps:
      - name: Require the AWS lane variables
        run: |
          missing=
          for name in BUMBLEDB_AWS_ROLE_ARN BUMBLEDB_S3_REGION BUMBLEDB_S3_LOG_BUCKET BUMBLEDB_S3_CKPT_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::set the repository variables:$missing"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.BUMBLEDB_AWS_ROLE_ARN }}
          role-session-name: bumbledb-ci-${{ github.run_id }}
          aws-region: ${{ vars.BUMBLEDB_S3_REGION }}
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: scripts/ci.sh s3
