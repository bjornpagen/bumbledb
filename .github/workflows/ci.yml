# One correctness/native build per platform. Performance is measured locally.
# Miri's two targets run independently; manual Miri-only dispatch avoids
# repeating the full platform battery after a push.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      miri_only:
        description: Run only the two Miri targets
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.miri_only || false }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule' && !inputs.miri_only
    uses: ./.github/workflows/bumbledb-log.yml
    secrets:
      BUMBLEDB_S3_SMOKE_BUCKET: ${{ secrets.BUMBLEDB_S3_SMOKE_BUCKET }}
      BUMBLEDB_S3_SMOKE_REGION: ${{ secrets.BUMBLEDB_S3_SMOKE_REGION }}
      BUMBLEDB_S3_SMOKE_ENDPOINT: ${{ secrets.BUMBLEDB_S3_SMOKE_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  static-linux-arm64:
    if: github.event_name != 'schedule' && !inputs.miri_only
    uses: ./.github/workflows/static-linux-arm64.yml

  miri:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-unknown-linux-gnu]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup show
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: miri-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            miri-${{ matrix.target }}-
      - run: scripts/miri.sh "${{ matrix.target }}"
