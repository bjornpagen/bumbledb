# The CI spine (the crucible packet (git ecec1dc3)). The battery
# (scripts/battery.sh) and the SDK fingerprint lock run per push on
# macos arm64 (macos-latest is M-series); the Miri lane runs on a
# nightly cron.
# The check lane runs on macos and on ubuntu-latest-as-host under an
# amazonlinux:2023 container (grail/40): Amazon Linux is the linux
# userspace — glibc 2.34, never Ubuntu — and that linux cell is the
# first real execution of the engine's linux arms and of the
# scalar-fallback promise (other 64-bit platforms compile and run
# scalar fallback correctly, no performance promises). The suite is
# linux-clean by construction:
# every host-pinned falsifier is #[ignore]d and every macos-only
# integration binary is whole-file cfg(target_os = "macos"). Run
# 29697582864 falsified that claim once — clockproxy's plausibility
# band read 0.18 GHz on the shared ubuntu runner — and the probe
# joined the host-pinned set (arch-conditioned ignore: the band is
# aarch64 physics). The sdk lane matrixes macos + the same
# amazonlinux:2023 linux cell as the check lane; the miri lane's
# native pass is the reference host's.
#
# Wall-time record (measured locally on the pinned M2 Max, 2026-07-13):
#   * Miri lane: 752 s ≈ 12.5 min — OVER the 10-minute per-push budget,
#     hence the cron (the "measure first, decide by the number" rule).
#   * check lane: scripts/battery.sh is the correctness body.
#   The lanes run in parallel: estimated under 15 minutes with warm
#   caches; the first run on a cold cache (toolchain download + full
#   builds) will exceed it once.
#
# Deliberate exclusions (each per the measurement discipline: measure
# first, decide by the number):
#   * NO benches: timing on a shared virtualized runner is noise; every
#     pinned margin is measured locally on the M2 Max.
#   * NO asm gates (scripts/check-asm.sh): aarch64 codegen inspection
#     is a local gate for the same reason — runner codegen/toolchain
#     drift would make it flaky without making it informative.
#   * NO fuzzing lanes: the fuzzing apparatus died by owner ruling
#     (2026-07-20) and the corpus-replay lane with it; the storm recipe
#     (crates/bumbledb-log/conformance/v3/README.md § Fuzz) runs inside
#     the battery, not as a CI lane of its own.
name: ci

on:
  # Qualify every successor implementation push, without publishing it.
  push:
    branches: [main, codex/bumbledb-1-0]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly Miri lane only (see the job-level `if`): 09:17 UTC.
    - cron: "17 9 * * *"

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  # Lane 1 — the workspace gate: env plus scripts/battery.sh.
  # Both cells run the identical script; on linux the run itself IS
  # the x86-64 scalar-fallback coverage (AL2023 userspace; the host
  # kernel is not a build userspace).
  check:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && fromJSON('{"image":"amazonlinux:2023"}') || fromJSON('null') }}
    timeout-minutes: 90
    steps:
      - name: Install the Amazon Linux 2023 toolchain
        if: matrix.os == 'ubuntu-latest'
        # AL2023 ships curl-minimal; --allowerasing swaps it for curl.
        run: |
          dnf -y install --allowerasing \
            gcc \
            gcc-c++ \
            make \
            binutils \
            git \
            tar \
            gzip \
            xz \
            unzip \
            python3 \
            sed \
            gawk \
            diffutils \
            findutils \
            ca-certificates \
            curl \
            nodejs24 \
            nodejs24-npm
          alternatives --set node /usr/bin/node-24
      - uses: actions/checkout@v5
      - name: Install rustup
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: install the pinned toolchain
        # rust-toolchain.toml owns the channel and components;
        # `rustup show` resolves and installs it.
        run: rustup show
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # restore-keys (every cache step here): an exact-key miss —
          # any lockfile or toolchain repin — restores the nearest
          # previous cache and rebuilds only the delta instead of going
          # fully cold. Prefix-restored target/ dirs accumulate stale
          # artifacts across saves; if cache size ever matters, rotate
          # the key — a maintenance nuance, not a reason to stay cold.
          # The linux key carries -al2023 so a restored cache cannot
          # be an Ubuntu-userspace target/ from before this pass.
          key: check-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            check-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-
      - uses: actions/setup-node@v5
        with:
          # ts/package.json engines pins node >=24. battery.sh runs
          # the ts/ and ts-log/ package-script trios.
          node-version: 24
      - name: install pnpm
        # ts/package.json#packageManager (pnpm@11.9.0) owns the exact
        # version; corepack reads and activates that pin.
        run: corepack enable pnpm
      - uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-${{ hashFiles('lean/lean-toolchain') }}
          restore-keys: |
            lean-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-
      - name: install elan
        # lean/lean-toolchain owns the exact version; elan resolves
        # and installs it on first `lake` invocation inside lean/.
        # A cache hit leaves the toolchain on disk; this step is PATH.
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: ts
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: check-pnpm-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-${{ hashFiles('ts/pnpm-lock.yaml', 'ts-log/pnpm-lock.yaml') }}
          restore-keys: |
            check-pnpm-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-
      - run: pnpm install --frozen-lockfile
        working-directory: ts
      - name: build the napi bridge
        # lane_b_interop.rs spawns a Node child that loads
        # @bjornpagen/bumbledb. nextest is battery lane 3, ahead of
        # the ts/ trio that builds the addon.
        run: pnpm run build
        working-directory: ts
      - run: pnpm install --frozen-lockfile
        working-directory: ts-log
      - run: scripts/battery.sh

  # Lane 2 — Miri, both interpretation targets (native arm64 + the
  # x86_64-linux cross-interpretation): 752 s ≈ 12.5 min measured
  # locally (2026-07-13, M2 Max, warm sysroot), over the 10-minute
  # per-push budget — so it runs on the nightly cron (and on manual
  # dispatch), not per push.
  miri:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: install the pinned toolchain
        run: rustup show
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: miri-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            miri-${{ runner.os }}-
      - run: scripts/miri.sh

  # Lane 3 — the SDK lane (the hardening-0.3.0 packet, PRD T6): both
  # halves of the cross-host fingerprint lock, per push. The TS half is
  # the full SDK gate exactly as run locally — build the napi bridge +
  # package from source, then tsc, biome, and `pnpm test` (the ONE
  # test-glob spelling — package.json's `test` script, its pattern
  # quoted so node's own glob engine always expands it, never the
  # shell; the rebuild it fronts is incremental after the named build
  # step). The Rust half is `cargo test` against ts/crate — the crate
  # is workspace-excluded, so the root workspace gate (lane 1) never
  # reaches it; this step is what executes
  # ts/crate/src/fingerprint_lock.rs. The T5 per-recipe goldens run
  # inside the two suites by construction.
  # Runner: an os matrix, exactly as the check lane — ts/scripts/build.ts
  # derives the LOCAL platform from its host (platform.ts), so the
  # linux cell (AL2023 userspace) is what executes the dev-twin
  # manifest synthesis, the `.so` artifact naming, and the loader's
  # linux branch — and the cross-host fingerprint lock genuinely
  # crosses hosts: both halves run on two architectures per push
  # (ruled 2026-07-23, R22).
  # Runtime budget (measured locally on the pinned M2 Max, 2026-07-18,
  # warm caches): pnpm run build 15.6 s (the bridge release compile
  # dominates) + tsc 1.4 s + biome 1.3 s + node --test 0.9 s + ts/crate
  # cargo test 9.7 s ≈ 29 s of work; a cold cache pays the toolchain
  # download and the full dependency builds once. Runs `needs:`-free in
  # parallel with the engine lanes, never gated behind them.
  sdk:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && fromJSON('{"image":"amazonlinux:2023"}') || fromJSON('null') }}
    timeout-minutes: 45
    steps:
      - name: Install the Amazon Linux 2023 toolchain
        if: matrix.os == 'ubuntu-latest'
        # AL2023 ships curl-minimal; --allowerasing swaps it for curl.
        run: |
          dnf -y install --allowerasing \
            gcc \
            gcc-c++ \
            make \
            binutils \
            git \
            tar \
            gzip \
            xz \
            unzip \
            python3 \
            sed \
            gawk \
            diffutils \
            findutils \
            ca-certificates \
            curl \
            nodejs24 \
            nodejs24-npm
          alternatives --set node /usr/bin/node-24
      - uses: actions/checkout@v5
      - name: Install rustup
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: install the pinned toolchain
        # rust-toolchain.toml at the repo root owns the channel for
        # ts/crate too: the crate is workspace-excluded but sits under
        # the root, and rustup resolves the toolchain file by walking
        # up from cwd, not from the manifest path.
        run: rustup show
      - uses: actions/setup-node@v5
        with:
          # ts/package.json engines pins node >=24 (the build script
          # and the tests run as .ts through native type stripping).
          node-version: 24
      - name: install pnpm
        # ts/package.json#packageManager (pnpm@11.9.0) owns the exact
        # version; corepack reads and activates that pin.
        run: corepack enable pnpm
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ts/crate/target
          key: sdk-cargo-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-${{ hashFiles('rust-toolchain.toml', 'ts/crate/Cargo.lock') }}
          restore-keys: |
            sdk-cargo-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-
      - name: resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: ts
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: sdk-pnpm-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-${{ hashFiles('ts/pnpm-lock.yaml') }}
          restore-keys: |
            sdk-pnpm-${{ runner.os }}${{ matrix.os == 'ubuntu-latest' && '-al2023' || '' }}-
      - run: pnpm install --frozen-lockfile
        working-directory: ts
      - name: build the napi bridge + SDK from source
        run: pnpm run build
        working-directory: ts
      - run: pnpm exec tsc --noEmit
        working-directory: ts
      - run: pnpm exec biome check .
        working-directory: ts
      - run: pnpm test
        working-directory: ts
      - name: the FFI lint wall (cleanup-0.5.0 ruling 12)
        # ts/crate is workspace-excluded, so lane 1's clippy never reaches
        # it; this step is what enforces the crate's own lint table
        # (deny unsafe_code with per-site reasons, deny
        # unsafe_op_in_unsafe_fn, the engine's clippy all+pedantic set).
        run: cargo clippy --manifest-path ts/crate/Cargo.toml --all-targets -- -D warnings
      - name: the Rust half of the lock (fingerprint_lock.rs)
        run: |
          cargo nextest --version || cargo install cargo-nextest --version 0.9.143 --locked
          cargo nextest run --manifest-path ts/crate/Cargo.toml --config-file .config/nextest.toml
          cargo test --manifest-path ts/crate/Cargo.toml --doc
