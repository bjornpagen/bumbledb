name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-shear
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: scripts/ci.sh lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      - run: scripts/ci.sh test

  # Pull requests build linux-x64 with addon-ci; main and releases build every
  # platform with fat LTO and keep the binaries for release.yml.
  addon:
    name: addon (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, darwin-arm64]
        event: ["${{ github.event_name }}"]
        exclude:
          - { event: pull_request, platform: linux-arm64 }
          - { event: pull_request, platform: darwin-arm64 }
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","darwin-arm64":"macos-26"}')[matrix.platform] }}
    # Linux addons link against glibc 2.34 (Amazon Linux 2023), the oldest supported runtime.
    container: ${{ startsWith(matrix.platform, 'linux-') && 'amazonlinux:2023' || '' }}
    timeout-minutes: 60
    env:
      BUMBLEDB_ADDON_PROFILE: ${{ github.event_name == 'pull_request' && 'addon-ci' || 'release' }}
    steps:
      - name: Install the Amazon Linux build tools
        if: startsWith(matrix.platform, 'linux-')
        run: |
          dnf -y install --allowerasing gcc gcc-c++ make git tar gzip xz findutils diffutils curl libatomic
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - name: Trust the checkout inside the container
        if: startsWith(matrix.platform, 'linux-')
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The setup actions expect npm and glibc libraries the Amazon Linux image lacks,
      # so the container installs Node from nodejs.org and pnpm from ts/package.json.
      - name: Install Node and pnpm inside the container
        if: startsWith(matrix.platform, 'linux-')
        env:
          NODE_VERSION: 26.11.1
        run: |
          arch=$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${arch}.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local
          node --version
          npm install --global "$(node -p 'require("./ts/package.json").packageManager')"
          pnpm --version
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - if: matrix.platform == 'darwin-arm64'
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ts/package.json
      - if: matrix.platform == 'darwin-arm64'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: scripts/ci.sh addon
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bdb.${{ matrix.platform }}.node
          path: target/addon/bdb.${{ matrix.platform }}.node
          if-no-files-found: error

  # SeaweedFS holds a per-key lock for conditional creates, so racing losers get 412.
  s3-seaweedfs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        ports: ["8333:8333"]
        env:
          AWS_ACCESS_KEY_ID: bumbledb-ci
          AWS_SECRET_ACCESS_KEY: bumbledb-ci-secret
          S3_BUCKET: bumbledb-log,bumbledb-ckpt
    env:
      BUMBLEDB_S3_TARGET: seaweedfs
      BUMBLEDB_S3_ENDPOINT: http://127.0.0.1:8333
      BUMBLEDB_S3_REGION: us-east-1
      BUMBLEDB_S3_LOG_BUCKET: bumbledb-log
      BUMBLEDB_S3_CKPT_BUCKET: bumbledb-ckpt
      BUMBLEDB_S3_PREFIX: ci/${{ github.run_id }}-${{ github.run_attempt }}/
      AWS_ACCESS_KEY_ID: bumbledb-ci
      AWS_SECRET_ACCESS_KEY: bumbledb-ci-secret
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - name: Wait for both SeaweedFS buckets
        run: |
          timeout 120 bash -c 'until aws s3api head-bucket --endpoint-url "$BUMBLEDB_S3_ENDPOINT" --bucket "$BUMBLEDB_S3_LOG_BUCKET" &&
            aws s3api head-bucket --endpoint-url "$BUMBLEDB_S3_ENDPOINT" --bucket "$BUMBLEDB_S3_CKPT_BUCKET"; do sleep 2; done'
      - run: scripts/ci.sh s3

  s3-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/s3-aws.yml
    permissions:
      contents: read
      id-token: write
