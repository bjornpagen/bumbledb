# The C++ SDK CI matrix (TODO_CPP.md §32) — lands complete, not
# incrementally, per the cpp-starter template's CI discipline: exact
# container tags, checksummed CMake/Ninja, SHA-pinned actions, pinned Rust.
#
# Jobs (all path-filtered to cpp/** + fixtures/** so engine-only pushes
# skip the whole file; rust-toolchain.toml and this workflow are included
# in the filter because a change to either invalidates every job here):
#   * gcc-release   — gcc:16.1.0-trixie container; release configure/build/
#                     ctest. ctest release carries the WHOLE production
#                     suite: unit + toolchain-conformance + bridge smoke +
#                     runtime + cookbook fingerprint/runtime parity tests
#                     (golden: fixtures/cookbook-fingerprints.txt) AND the
#                     §34 compile-fail suite (pinned-diagnostic tests run
#                     only in unsanitized production graphs — see
#                     cpp/tests/CMakeLists.txt for the pinned GCC 16.1
#                     sanitizer/constexpr quirk).
#   * gcc-asan-ubsan, gcc-tsan — same container, sanitizer presets
#                     (compile-fail self-excludes there by design).
#   * lint          — ubuntu-24.04 + apt.llvm.org LLVM 22; configures the
#                     `lint` preset (BDB_LINT_GRAPH=ON) with -D overrides
#                     pointing at the real LLVM 22 binaries and the libc++
#                     modules manifest (the starter's proven recipe);
#                     clang-tidy with the dialect custom checks runs during
#                     the build. No ctest: the lint graph is enforcement,
#                     not a test runner (no lint test preset exists).
#   * bridge        — plain ubuntu-24.04; cargo clippy -D warnings + cargo
#                     test for cpp/bridge (raw ABI tests, §35), under the
#                     crate's own [lints] regime (the workspace lint set,
#                     restated in cpp/bridge/Cargo.toml because the crate
#                     is a workspace-excluded leaf).
#
# Rust is installed in EVERY cmake job, not just the bridge job: cpp/foreign
# cargo-builds cpp/bridge (which path-depends on crates/bumbledb) inside
# every configure graph, production and lint alike.
#
# Every remote pin, verified 2026-08-08 without running containers (no
# docker on the authoring machine):
#   * docker.io/library/gcc:16.1.0-trixie — Docker Hub API: tag exists,
#     active, amd64 digest sha256:cd2f0099…, last pushed 2026-08-05. It is
#     the most specific 16.1 tag and ships the compiler as unversioned
#     `g++`, hence -DCMAKE_CXX_COMPILER=g++ below (the cpp/ configure gate
#     still enforces GNU 16.1.x exactly).
#   * CMake 4.2.1 linux-x86_64 tarball — asset present on the Kitware
#     v4.2.1 release; SHA-256 below matches the official
#     cmake-4.2.1-SHA-256.txt from the same release. Newer 4.2.x exist
#     (4.2.7 as of today) but 4.2.1 is what the repo is developed against
#     (the local pinned cmake is 4.2.1) and cpp/CMakeLists.txt hardcodes
#     the 4.2-series experimental CXX_IMPORT_STD UUID (any bump must stay
#     in the 4.2 series and is a deliberate act, not a CI drift).
#   * Ninja 1.13.2 ninja-linux.zip — asset present on the ninja-build
#     v1.13.2 release; SHA-256 below recomputed from the downloaded asset
#     on 2026-08-08 (matches the cpp-starter pin).
#   * actions/checkout v5 — tag resolved via
#     `gh api repos/actions/checkout/git/ref/tags/v5` on 2026-08-08:
#     fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09.
#   * rustup-init 1.29.0 (current stable per release-stable.toml on
#     2026-08-08) for x86_64-unknown-linux-gnu — SHA-256 below is the
#     official static.rust-lang.org/rustup/archive/…/rustup-init.sha256.
#     Installed with --default-toolchain none: the repo's
#     rust-toolchain.toml (channel nightly-2026-07-12, components incl.
#     clippy/rustfmt, target x86_64-unknown-linux-gnu) auto-applies from
#     any directory inside the checkout; `rustup show` resolves and
#     installs it, exactly like the engine's ci.yml lanes. The
#     nightly-2026-07-12 dist artifacts (channel manifest, rustc +
#     rust-std for x86_64-unknown-linux-gnu) were confirmed present on
#     static.rust-lang.org on 2026-08-08.
#   * apt.llvm.org llvm-toolchain-noble-22 suite — Release file present
#     (snapshot dated 2026-07-30; libc++-22-dev 1:22.1.8~++20260714…).
#     The libc++ modules manifest path was re-verified today by
#     downloading that exact deb (SHA256 6016d2b8… per the suite's
#     Packages index) and listing it: it ships
#     /usr/lib/llvm-22/lib/libc++.modules.json (and a copy under
#     /usr/lib/x86_64-linux-gnu/). apt.llvm.org is a moving snapshot
#     archive — the suite name pins the major (22), not the snapshot; the
#     cpp/ configure gate rejects anything outside Clang 22.x.
#
# Not verifiable without a first run (no docker locally, workflow never
# executed):
#   * step-level behavior inside the gcc container (tool availability
#     beyond curl/tar/git, glibc vs. the runner);
#   * sanitizer runtime vs. the runner kernel's ASLR entropy
#     (vm.mmap_rnd_bits) — historically flaky for ASan/TSan on
#     ubuntu-24.04 runners with older toolchains; GCC 16.1's runtimes are
#     expected to cope, untested here;
#   * `rustup show` component installs (miri/llvm-tools/rust-src) for
#     nightly-2026-07-12 on x86_64-linux inside the trixie container —
#     the engine ci.yml proves the same invocation on ubuntu-latest, the
#     container is new ground;
#   * wall-clock cost: every job cargo-builds the engine crate release
#     and the cmake jobs build the full module graph cold (no caches by
#     choice: nothing uncached can go stale, and the first run measures
#     the real cost before any cache policy is earned).

name: cpp

on:
  push:
    branches: [main]
    paths:
      - "cpp/**"
      - "fixtures/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "cpp/**"
      - "fixtures/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cpp.yml"
  workflow_dispatch:

env:
  CMAKE_URL: https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-linux-x86_64.tar.gz
  CMAKE_SHA256: c059bff1e97a2b6b5b0c0872263627486345ad0ed083298cb21cff2eda883980
  NINJA_URL: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
  NINJA_SHA256: 5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6
  RUSTUP_URL: https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init
  RUSTUP_SHA256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
  CARGO_TERM_COLOR: always

jobs:
  gcc-release:
    runs-on: ubuntu-24.04
    container: gcc:16.1.0-trixie
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake and Ninja
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | sha256sum -c
          tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja-linux.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja-linux.zip" | sha256sum -c
          (cd /usr/local/bin && cmake -E tar xf /tmp/ninja-linux.zip && chmod +x ninja)
          cmake --version
          ninja --version
          g++ --version
      - name: Install pinned rustup and the repo toolchain
        run: |
          curl -fsSL -o /tmp/rustup-init "$RUSTUP_URL"
          echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # rust-toolchain.toml owns the channel (nightly-2026-07-12) and
          # components; `rustup show` from inside the checkout resolves
          # and installs it (the engine ci.yml precedent).
          "$HOME/.cargo/bin/rustup" show
          "$HOME/.cargo/bin/cargo" --version
      # The gcc image ships the compiler as unversioned `g++`; override the
      # preset's g++-16 (the configure gate still enforces GNU 16.1.x).
      - name: Configure
        working-directory: cpp
        run: cmake --preset release -DCMAKE_CXX_COMPILER=g++
      - name: Build
        working-directory: cpp
        run: cmake --build --preset release
      # ctest release = unit + conformance + bridge smoke + runtime +
      # cookbook fingerprint/runtime parity + the compile-fail suite.
      - name: Test
        working-directory: cpp
        run: ctest --preset release

  gcc-asan-ubsan:
    runs-on: ubuntu-24.04
    container: gcc:16.1.0-trixie
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake and Ninja
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | sha256sum -c
          tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja-linux.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja-linux.zip" | sha256sum -c
          (cd /usr/local/bin && cmake -E tar xf /tmp/ninja-linux.zip && chmod +x ninja)
      - name: Install pinned rustup and the repo toolchain
        run: |
          curl -fsSL -o /tmp/rustup-init "$RUSTUP_URL"
          echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
      - name: Configure
        working-directory: cpp
        run: cmake --preset asan-ubsan -DCMAKE_CXX_COMPILER=g++
      - name: Build
        working-directory: cpp
        run: cmake --build --preset asan-ubsan
      - name: Test
        working-directory: cpp
        run: ctest --preset asan-ubsan

  gcc-tsan:
    runs-on: ubuntu-24.04
    container: gcc:16.1.0-trixie
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake and Ninja
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | sha256sum -c
          tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja-linux.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja-linux.zip" | sha256sum -c
          (cd /usr/local/bin && cmake -E tar xf /tmp/ninja-linux.zip && chmod +x ninja)
      - name: Install pinned rustup and the repo toolchain
        run: |
          curl -fsSL -o /tmp/rustup-init "$RUSTUP_URL"
          echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
      - name: Configure
        working-directory: cpp
        run: cmake --preset tsan -DCMAKE_CXX_COMPILER=g++
      - name: Build
        working-directory: cpp
        run: cmake --build --preset tsan
      - name: Test
        working-directory: cpp
        run: ctest --preset tsan

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake and Ninja
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | sha256sum -c
          sudo tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja-linux.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja-linux.zip" | sha256sum -c
          (cd /tmp && cmake -E tar xf /tmp/ninja-linux.zip && chmod +x ninja && sudo mv ninja /usr/local/bin/)
      # The runner image ships rustup; rust-toolchain.toml owns the channel.
      # The lint graph still cargo-builds the bridge (cpp/foreign is part of
      # BOTH graphs), so Rust is required here too.
      - name: Install the repo Rust toolchain
        run: rustup show
      - name: Install LLVM 22 from apt.llvm.org (pinned suite)
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/apt-llvm-org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm-org.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/apt-llvm-org.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-22 clang-tidy-22 clang-tools-22 libc++-22-dev libc++abi-22-dev
          /usr/lib/llvm-22/bin/clang++ --version
          /usr/lib/llvm-22/bin/clang-tidy --version
          /usr/lib/llvm-22/bin/clang-scan-deps --version
          test -f /usr/lib/llvm-22/lib/libc++.modules.json
      # The lint preset uses bare tool names (CMakeUserPresets.json carries
      # the macOS lint-local paths); point every tool at the real LLVM 22
      # binaries and at the libc++ modules manifest the Debian packages
      # install (path confirmed from the libc++-22-dev deb contents).
      - name: Configure
        working-directory: cpp
        run: |
          cmake --preset lint \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-22/bin/clang++ \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=/usr/lib/llvm-22/bin/clang-scan-deps \
            -DCMAKE_CXX_CLANG_TIDY='/usr/lib/llvm-22/bin/clang-tidy;--experimental-custom-checks' \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/usr/lib/llvm-22/lib/libc++.modules.json
      # clang-tidy (with the dialect custom checks) runs during the build;
      # a lint finding is a build failure. There is no lint test preset.
      - name: Build
        working-directory: cpp
        run: cmake --build --preset lint

  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The runner image ships rustup; rust-toolchain.toml (repo root) owns
      # the channel and applies to cpp/bridge too — rustup resolves the
      # toolchain file through ancestor directories, workspace exclusion
      # notwithstanding.
      - name: Install the repo Rust toolchain
        run: rustup show
      # clippy under the crate's [lints] regime (the workspace lint set,
      # restated in cpp/bridge/Cargo.toml), warnings denied.
      - name: Clippy
        working-directory: cpp/bridge
        run: cargo clippy --all-targets -- -D warnings
      # The raw ABI test suite (TODO_CPP §35).
      - name: Test
        working-directory: cpp/bridge
        run: cargo test
