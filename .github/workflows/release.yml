# A v* tag publishes the npm package family once ci and musl pass on the tagged
# commit and the release environment approves. A package version already on npm,
# or a release already on GitHub, is left as it is.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  musl:
    uses: ./.github/workflows/musl.yml

  publish:
    needs: [ci, musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag is on main and names the workspace and package versions
        run: |
          version=${GITHUB_REF_NAME#v}
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          cargo=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          for found in "$cargo" $(for m in ts/package.json ts/npm/*/package.json; do node -p "require('./$m').version"; done); do
            if [ "$found" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME, but a manifest says $found"
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - uses: actions/download-artifact@v8
        with:
          pattern: bdb.*.node
          path: natives
          merge-multiple: true
      - run: pnpm --dir ts install --frozen-lockfile
      - run: node scripts/family.mjs pack natives family
      - run: node scripts/family.mjs smoke family
      - name: Publish with npm trusted publishing, platform packages first
        run: |
          version=${GITHUB_REF_NAME#v}
          core="family/bjornpagen-bumbledb-$version.tgz"
          publish() {
            local name
            name=$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"
            else
              npm publish "$1"
            fi
          }
          for tarball in family/*.tgz; do
            if [ "$tarball" != "$core" ]; then
              publish "$tarball"
            fi
          done
          publish "$core"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" family/*.tgz family/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
