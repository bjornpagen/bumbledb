# Reusable correctness/native build: one full battery per supported platform.
# ci.yml calls this once on pushes/PRs; no duplicate independent push trigger.
# Linux artifacts retain the Amazon Linux 2023 / glibc 2.34 baseline.
# Missing S3 credentials remain NotRun, never Passed. No job publishes packages.
name: bumbledb-log

on:
  workflow_call:
    secrets:
      BUMBLEDB_S3_SMOKE_BUCKET:
        required: false
      BUMBLEDB_S3_SMOKE_REGION:
        required: false
      BUMBLEDB_S3_SMOKE_ENDPOINT:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    container: amazonlinux:2023
    timeout-minutes: 90
    steps:
      - name: Install the Amazon Linux 2023 toolchain
        # AL2023 ships curl-minimal. `dnf install curl` without
        # --allowerasing is a conflict; the transaction dies before
        # rustup, the napi build, or either artifact upload.
        run: |
          dnf -y install --allowerasing \
            gcc \
            gcc-c++ \
            make \
            binutils \
            git \
            tar \
            gzip \
            xz \
            unzip \
            python3 \
            sed \
            gawk \
            diffutils \
            findutils \
            ca-certificates \
            curl \
            nodejs24
          alternatives --set node /usr/bin/node-24
      - uses: actions/checkout@v5
      - name: Trust this checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the pinned toolchain
        run: rustup show
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: log-al2023-arm64-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'ts/crate/Cargo.lock') }}
          restore-keys: |
            log-al2023-arm64-cargo-
      - name: Activate the pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json
          run_install: false
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: ts
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: log-al2023-arm64-pnpm-${{ hashFiles('ts/pnpm-lock.yaml', 'ts-log/pnpm-lock.yaml') }}
          restore-keys: |
            log-al2023-arm64-pnpm-
      - name: Build and qualify one immutable package family
        run: node scripts/build-family.mjs --out "$RUNNER_TEMP/bumbledb-family"
      - name: Build the duty binary
        run: cargo build --release --bin duty
        working-directory: ${{ runner.temp }}/bumbledb-family/source
      - name: Complete platform correctness battery
        run: "$RUNNER_TEMP/bumbledb-family/source/scripts/battery.sh"
      - name: Stage the linux-arm64 artifacts
        run: |
          mkdir -p /tmp/grail-artifacts
          cp "$RUNNER_TEMP/bumbledb-family/source/ts/npm/linux-arm64/bumbledb.node" /tmp/grail-artifacts/bumbledb.linux-arm64.node
          cp "$RUNNER_TEMP/bumbledb-family/source/ts/npm/linux-arm64/.native-provenance.json" /tmp/grail-artifacts/bumbledb.linux-arm64.provenance.json
          cp "$RUNNER_TEMP/bumbledb-family/source/target/release/duty" /tmp/grail-artifacts/bumbledb-log-duty
      - uses: actions/upload-artifact@v4
        with:
          name: bumbledb.linux-arm64.node
          path: |
            /tmp/grail-artifacts/bumbledb.linux-arm64.node
            /tmp/grail-artifacts/bumbledb.linux-arm64.provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bumbledb-log-duty
          path: /tmp/grail-artifacts/bumbledb-log-duty
          if-no-files-found: error
      - name: Gated S3 cell (NotRun without credentials)
        env:
          BUMBLEDB_S3_SMOKE_BUCKET: ${{ secrets.BUMBLEDB_S3_SMOKE_BUCKET }}
          BUMBLEDB_S3_SMOKE_REGION: ${{ secrets.BUMBLEDB_S3_SMOKE_REGION }}
          BUMBLEDB_S3_SMOKE_ENDPOINT: ${{ secrets.BUMBLEDB_S3_SMOKE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=
          [ -n "${BUMBLEDB_S3_SMOKE_BUCKET:-}" ] || missing="$missing BUMBLEDB_S3_SMOKE_BUCKET"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || missing="$missing AWS_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || missing="$missing AWS_SECRET_ACCESS_KEY"
          if [ -n "$missing" ]; then
            echo "real-s3-iam NotRun: missing$missing (not qualification; do not record Passed)"
            exit 0
          fi
          echo "S3 credentials present; running the crate's gated backend cell (still not a Passed evidence row until release-results.mjs validates it)"
          cd "$RUNNER_TEMP/bumbledb-family/source"
          cargo nextest run --workspace -E 'test(s3_smoke)' --success-output immediate

