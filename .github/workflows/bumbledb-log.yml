  darwin:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup show
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Activate the pinned pnpm
        run: corepack enable pnpm
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ts/crate/target
          key: log-darwin-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'ts/crate/Cargo.lock') }}
          restore-keys: |
            log-darwin-cargo-
      - uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            lean/.lake
          key: log-darwin-lean-${{ hashFiles('lean/lean-toolchain') }}
          restore-keys: |
            log-darwin-lean-
      - name: install elan
        # lean/lean-toolchain owns the exact version; elan resolves
        # and installs it on first `lake` invocation inside lean/.
        # A cache hit leaves the toolchain on disk; this step is PATH.
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: ts
      - uses: actions/cache@v5
