  darwin:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup show
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Activate the pinned pnpm
        run: corepack enable pnpm
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: log-darwin-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'ts/crate/Cargo.lock') }}
          restore-keys: |
            log-darwin-cargo-
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: ts
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: log-darwin-pnpm-${{ hashFiles('ts/pnpm-lock.yaml', 'ts-log/pnpm-lock.yaml') }}
          restore-keys: |
            log-darwin-pnpm-
      - name: Build and qualify one immutable package family
        run: node scripts/build-family.mjs --out "$RUNNER_TEMP/bumbledb-family"
      - name: Complete platform correctness battery
        run: "$RUNNER_TEMP/bumbledb-family/source/scripts/battery.sh"
      - name: Stage macOS native provenance
        run: |
          mkdir -p /tmp/grail-artifacts
          cp "$RUNNER_TEMP/bumbledb-family/source/ts/npm/darwin-arm64/bumbledb.node" /tmp/grail-artifacts/bumbledb.darwin-arm64.node
          cp "$RUNNER_TEMP/bumbledb-family/source/ts/npm/darwin-arm64/.native-provenance.json" /tmp/grail-artifacts/bumbledb.darwin-arm64.provenance.json
