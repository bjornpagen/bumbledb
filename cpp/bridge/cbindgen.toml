# cbindgen configuration for the C-ABI bridge.
# Pinned tool: cbindgen 0.29.4 (installed via `cargo install --locked cbindgen`).
# Regenerate the committed header with:
#
#     cd cpp/bridge && cbindgen --config cbindgen.toml --crate bumbledb-cpp-bridge \
#         --output ../foreign/bumbledb_c.h
#
# The output belongs to cpp/foreign/ — the explicit compatibility zone; it
# may use the preprocessor because foreign/ is exempt from the dialect's
# preprocessor ban (§14). The C++ SDK wraps it; no C declaration leaks
# upward.

language = "C"
cpp_compat = true
include_guard = "BUMBLEDB_C_H"
usize_is_size_t = true
documentation = true
documentation_style = "c99"
style = "both"

header = """
/* bumbledb_c.h — the generated C ABI of the bumbledb C++ SDK bridge.
 *
 * GENERATED FILE — DO NOT EDIT. Regenerate from cpp/bridge with:
 *     cbindgen --config cbindgen.toml --crate bumbledb-cpp-bridge \\
 *         --output ../foreign/bumbledb_c.h
 * (pinned cbindgen 0.29.4; see cpp/bridge/cbindgen.toml)
 *
 * Boundary protocol: every fallible function returns a bdb_status and
 * takes a trailing bdb_error** out-param — BDB_STATUS_OK (no error),
 * BDB_STATUS_ABORTED (the caller's callback aborted; no error),
 * BDB_STATUS_ERROR (a bdb_error* is written; the caller owns it and
 * frees it with bdb_error_destroy), BDB_STATUS_MISUSE (a contract
 * violation — null required pointer, stale snapshot/tx ref, index out
 * of range, unknown enum tag, bool payload other than 0/1; no error is
 * allocated).
 *
 * Lexical capabilities: bdb_snapshot_ref / bdb_tx_ref live in a stable
 * heap slot inside the owning bdb_db. The callback receives a pointer
 * into that slot; when the callback returns the slot is invalidated
 * (alive = false, engine pointers nulled). A stashed pointer still names
 * the db's slot and answers BDB_STATUS_MISUSE rather than use-after-free.
 * They are never owned or destroyed by the caller. bdb_db_write_from may
 * be called from inside a read callback with that callback's still-live
 * snapshot ref; nested writes are refused with a typed
 * BDB_ERROR_KIND_ENVIRONMENT_LOCKED error. One live read callback per
 * handle (the single snapshot slot); nested or concurrent reads, and
 * destroy during a live callback, are refused.
 *
 * Callbacks: a C++ exception thrown from a read/write callback is caught
 * by the foreign trampoline and becomes BDB_CALLBACK_CONTROL_ABORT; it
 * never unwinds into Rust. Unknown callback-control tags are MISUSE.
 *
 * View lifetimes: bdb_value string/bytes payloads handed OUT borrow the
 * carrier named at the accessor (bdb_row_set, bdb_answers, bdb_error)
 * and die with it (or on the carrier's next clear/execute). Views handed
 * IN are copied before the call returns; no caller memory is retained.
 */"""

[export]
# Tag enumerations are named constants for C++ (`abi_tag`); wire fields
# are u32 so an out-of-range C enum is MISUSE rather than UB. cbindgen
# drops unused types, so the tags must be forced into the header.
include = [
    "bdb_value_kind",
    "bdb_param_kind",
    "bdb_value_type_kind",
    "bdb_interval_element",
    "bdb_literal_kind",
    "bdb_statement_spec_kind",
    "bdb_literal_set_kind",
    "bdb_weight_kind",
    "bdb_capacity_window_kind",
    "bdb_bound_kind",
    "bdb_callback_control",
    "bdb_head_term_kind",
    "bdb_head_op",
    "bdb_find_term_kind",
    "bdb_atom_source_kind",
    "bdb_term_kind",
    "bdb_condition_kind",
    "bdb_cmp_op_kind",
]
# The ref-only capability types are opaque to C by design (§14): the
# bridge never lets the caller construct or destroy one. The exception
# trampoline is linked from the staticlib, not a public C entry.
exclude = ["bdb_invoke_read_callback", "bdb_invoke_write_callback"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
