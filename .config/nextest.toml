# Profiles: default (local), ci (pull requests and main), deep (nightly
# BUMBLEDB_DEEP sweeps), default-miri (selected automatically by
# `cargo miri nextest`). Every profile inherits default's settings and overrides.

# Tests named `disk_*` or living in a `disk` module saturate the disk (fsync
# loops, crash children); two at a time keeps them off each other's latency.
[test-groups]
disk = { max-threads = 2 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = "test(/(^|::)disk(_|::)/)"
test-group = "disk"

[profile.ci]
failure-output = "immediate-final"

[profile.deep]
failure-output = "immediate-final"
slow-timeout = { period = "300s", terminate-after = 6 }

[profile.default-miri]
failure-output = "immediate-final"
slow-timeout = { period = "600s", terminate-after = 6 }
